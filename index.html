<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circular Image Editor</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (development builds) -->
  <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <!-- Babel for in‑browser JSX transform -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center py-8">
  <div id="root" class="w-full"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    /* ───────────────── Config ───────────────── */
    const WORKING_CANVAS = 2000;              // internal high‑res canvas
    const EXPORT_MIN     = 500;
    const EXPORT_MAX     = 3000;
    const EXPORT_DEFAULT = 2000;

    /* ───────────────── Helpers ───────────────── */
    const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

    const download = (dataUrl, filename) => {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    const Range = ({ value, min, max, step = 1, onChange, label }) => (
      <div className="space-y-1">
        {label && (
          <label className="block text-sm font-medium">
            {label}: <span className="font-mono">{value}</span>
          </label>
        )}
        <input
          type="range"
          className="w-full"
          min={min}
          max={max}
          step={step}
          value={value}
          onChange={(e) => onChange(clamp(parseFloat(e.target.value), min, max))}
        />
      </div>
    );

    const TextInput = ({ value, onChange, placeholder, label }) => (
      <div className="space-y-1">
        {label && <label className="block text-sm font-medium">{label}</label>}
        <input
          type="text"
          className="w-full p-2 border rounded"
          value={value}
          onChange={(e) => onChange(e.target.value)}
          placeholder={placeholder}
        />
      </div>
    );

    /* ───────────────── App ───────────────── */
    function App() {
      /* Image */
      const [image, setImage] = useState(null);
      const [imageScale, setImageScale] = useState(1);
      const [imagePos, setImagePos]   = useState({ x: 0, y: 0 });
      const [imageRot, setImageRot]   = useState(0);
      const [dragging, setDragging]   = useState(false);
      const dragStart = useRef({ x: 0, y: 0 });

      /* Text */
      const [topText, setTopText] = useState('');
      const [botText, setBotText] = useState('');

      // per‑side typographic settings
      const [topFontSize, setTopFontSize] = useState(48);
      const [botFontSize, setBotFontSize] = useState(48);

      const [topSpacing, setTopSpacing] = useState(1);
      const [botSpacing, setBotSpacing] = useState(1);

      const [topDist, setTopDist] = useState(40);
      const [botDist, setBotDist] = useState(40);

      const [fontWeight, setFontWeight] = useState('bold');
      const [fontStyle, setFontStyle]   = useState('normal');
      const [textColor, setTextColor]   = useState('#000000');

      const [showWhere, setShowWhere] = useState('both'); // both | top | bottom
      const [topStart, setTopStart] = useState(0);         // 0‑1 turn offset
      const [botStart, setBotStart] = useState(0);

      /* Circle / Export */
      const [circleScale, setCircleScale] = useState(0.8);
      const [exportSize, setExportSize]   = useState(EXPORT_DEFAULT);

      /* Refs */
      const canvasRef = useRef(null);
      const fileInput = useRef(null);

      /* Canvas init */
      useEffect(() => {
        const canvas = canvasRef.current;
        canvas.width = canvas.height = WORKING_CANVAS;
      }, []);

      /* Image upload */
      const handleUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = ({ target }) => {
          const img = new Image();
          img.onload = () => {
            setImage(img);
            setImagePos({ x: 0, y: 0 });
            setImageScale(1);
            setImageRot(0);
          };
          img.src = target.result;
        };
        reader.readAsDataURL(file);
      };

      /* Dragging logic */
      const onPointerDown = (e) => {
        if (!image) return;
        setDragging(true);
        dragStart.current = {
          x: e.clientX - imagePos.x,
          y: e.clientY - imagePos.y,
        };
      };
      const onPointerMove = (e) => {
        if (!dragging) return;
        setImagePos({
          x: e.clientX - dragStart.current.x,
          y: e.clientY - dragStart.current.y,
        });
      };
      const onPointerUp = () => setDragging(false);

      /* Drawing */
      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingQuality = 'high';

        // background
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const center = { x: canvas.width / 2, y: canvas.height / 2 };
        const radius = Math.min(center.x, center.y) * circleScale;

        /* Masked image */
        if (image) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
          ctx.clip();

          ctx.translate(center.x + imagePos.x, center.y + imagePos.y);
          ctx.rotate((imageRot * Math.PI) / 180);
          ctx.scale(imageScale, imageScale);
          ctx.drawImage(image, -image.width / 2, -image.height / 2);
          ctx.restore();
        }

        /* Curved text helper */
        const drawText = ({ txt, fontSize, spacing, dist, start, invert }) => {
          if (!txt) return;

          ctx.save();
          ctx.font = `${fontWeight} ${fontStyle} ${fontSize}px Arial`;
          ctx.fillStyle = textColor;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          const textRadius = radius + dist;
          const full = Math.PI * 2;
          const angPer = (full / txt.length) * spacing;
          const baseAng = start * full;
          const dir = invert ? -1 : 1; // direction along the path

          [...txt].forEach((ch, i) => {
            const ang = baseAng + dir * i * angPer;
            ctx.save();
            ctx.translate(
              center.x + textRadius * Math.cos(ang),
              center.y + textRadius * Math.sin(ang)
            );
            ctx.rotate(ang + (invert ? -Math.PI / 2 : Math.PI / 2));
            ctx.fillText(ch, 0, 0);
            ctx.restore();
          });

          ctx.restore();
        };

        /* Draw top / bottom text */
        if (topText && (showWhere === 'top' || showWhere === 'both')) {
          drawText({
            txt: topText,
            fontSize: topFontSize,
            spacing: topSpacing,
            dist: topDist,
            start: topStart,
            invert: false,
          });
        }
        if (botText && (showWhere === 'bottom' || showWhere === 'both')) {
          drawText({
            txt: botText,
            fontSize: botFontSize,
            spacing: botSpacing,
            dist: botDist,
            start: botStart,
            invert: true,
          });
        }
      }, [
        image,
        imageScale,
        imagePos,
        imageRot,
        circleScale,
        topText,
        botText,
        topFontSize,
        botFontSize,
        topSpacing,
        botSpacing,
        topDist,
        botDist,
        topStart,
        botStart,
        fontWeight,
        fontStyle,
        textColor,
        showWhere,
      ]);

      /* Export */
      const handleSave = () => {
        const size = clamp(exportSize, EXPORT_MIN, EXPORT_MAX);
        const base = canvasRef.current;
        if (size === WORKING_CANVAS) {
          download(base.toDataURL('image/png'), `circle-${size}px.png`);
          return;
        }
        const out = document.createElement('canvas');
        out.width = out.height = size;
        const octx = out.getContext('2d');
        octx.drawImage(base, 0, 0, size, size);
        download(out.toDataURL('image/png'), `circle-${size}px.png`);
      };

      /* UI */
      return (
        <div className="max-w-5xl w-full grid lg:grid-cols-2 gap-8 px-4">
          {/* Controls */}
          <div className="space-y-6">
            {/* Image controls */}
            <div className="space-y-4 p-4 bg-white rounded shadow">
              <h2 className="font-semibold text-lg">Image</h2>
              <button
                className="px-4 py-2 bg-indigo-600 text-white rounded"
                onClick={() => fileInput.current.click()}
              >
                Upload Image
              </button>
              <input
                type="file"
                accept="image/*"
                className="hidden"
                ref={fileInput}
                onChange={handleUpload}
              />
              <Range
                label="Scale"
                value={imageScale}
                min={0.05}
                max={2}
                step={0.05}
                onChange={setImageScale}
              />
              <Range
                label="Rotation"
                value={imageRot}
                min={-180}
                max={180}
                step={1}
                onChange={setImageRot}
              />
            </div>

            {/* Circle & Export */}
            <div className="space-y-4 p-4 bg-white rounded shadow">
              <h2 className="font-semibold text-lg">Circle / Export</h2>
              <Range
                label="Circle Scale"
                value={circleScale}
                min={0.4}
                max={1}
                step={0.01}
                onChange={setCircleScale}
              />
              <Range
                label="PNG Size (px)"
                value={exportSize}
                min={EXPORT_MIN}
                max={EXPORT_MAX}
                step={100}
                onChange={setExportSize}
              />
              <button
                className="px-4 py-2 bg-green-600 text-white rounded"
                onClick={handleSave}
              >
                Download PNG
              </button>
            </div>

            {/* Text inputs */}
            <div className="space-y-8">
              {/* Top text group */}
              <div className="space-y-4 p-4 bg-white rounded shadow">
                <h2 className="font-semibold text-lg">Top Text</h2>
                <TextInput
                  label="Content"
                  value={topText}
                  onChange={setTopText}
                  placeholder="Top caption"
                />
                <Range
                  label="Font Size"
                  value={topFontSize}
                  min={10}
                  max={200}
                  onChange={setTopFontSize}
                />
                <Range
                  label="Letter Spacing"
                  value={topSpacing}
                  min={0}
                  max={1}
                  step={0.01}
                  onChange={setTopSpacing}
                />
                <Range
                  label="Distance"
                  value={topDist}
                  min={0}
                  max={200}
                  onChange={setTopDist}
                />
                <Range
                  label="Start Offset (turns)"
                  value={topStart}
                  min={0}
                  max={1}
                  step={0.01}
                  onChange={setTopStart}
                />
              </div>

              {/* Bottom text group */}
              <div className="space-y-4 p-4 bg-white rounded shadow">
                <h2 className="font-semibold text-lg">Bottom Text</h2>
                <TextInput
                  label="Content"
                  value={botText}
                  onChange={setBotText}
                  placeholder="Bottom caption"
                />
                <Range
                  label="Font Size"
                  value={botFontSize}
                  min={10}
                  max={200}
                  onChange={setBotFontSize}
                />
                <Range
                  label="Letter Spacing"
                  value={botSpacing}
                  min={0}
                  max={1}
                  step={0.01}
                  onChange={setBotSpacing}
                />
                <Range
                  label="Distance"
                  value={botDist}
                  min={0}
                  max={200}
                  onChange={setBotDist}
                />
                <Range
                  label="Start Offset (turns)"
                  value={botStart}
                  min={0}
                  max={1}
                  step={0.01}
                  onChange={setBotStart}
                />
              </div>
            </div>

            {/* Shared typography controls */}
            <div className="space-y-4 p-4 bg-white rounded shadow">
              <h2 className="font-semibold text-lg">Shared Text Style</h2>
              <div className="flex items-center space-x-4">
                <label className="text-sm font-medium">Weight</label>
                <select
                  value={fontWeight}
                  onChange={(e) => setFontWeight(e.target.value)}
                  className="border rounded p-1"
                >
                  <option value="normal">Normal</option>
                  <option value="bold">Bold</option>
                  <option value="900">Black</option>
                </select>
              </div>
              <div className="flex items-center space-x-4">
                <label className="text-sm font-medium">Style</label>
                <select
                  value={fontStyle}
                  onChange={(e) => setFontStyle(e.target.value)}
                  className="border rounded p-1"
                >
                  <option value="normal">Normal</option>
                  <option value="italic">Italic</option>
                </select>
              </div>
              <div className="flex items-center space-x-4">
                <label className="text-sm font-medium">Color</label>
                <input
                  type="color"
                  value={textColor}
                  onChange={(e) => setTextColor(e.target.value)}
                />
              </div>
              <div className="flex items-center space-x-4">
                <label className="text-sm font-medium">Show</label>
                <select
                  value={showWhere}
                  onChange={(e) => setShowWhere(e.target.value)}
                  className="border rounded p-1"
                >
                  <option value="both">Both</option>
                  <option value="top">Top Only</option>
                  <option value="bottom">Bottom Only</option>
                </select>
              </div>
            </div>
          </div>

          {/* Canvas */}
          <div className="flex flex-col items-center">
            <canvas
              ref={canvasRef}
              style={{ width: '100%', maxWidth: 500, cursor: image ? 'grab' : 'default' }}
              onPointerDown={onPointerDown}
              onPointerMove={onPointerMove}
              onPointerUp={onPointerUp}
              onPointerLeave={onPointerUp}
            />
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
